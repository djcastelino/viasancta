<!DOCTYPE html>
<html>
<head>
  <title>Divine Pilgrim Icon Generator</title>
</head>
<body>
  <h1>Divine Pilgrim Icon Generator</h1>
  <canvas id="canvas192" width="192" height="192"></canvas>
  <canvas id="canvas512" width="512" height="512"></canvas>
  <br>
  <button onclick="downloadIcons()">Download Icons</button>

  <script>
    function drawIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      
      // Purple gradient background
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#6e3a6c');
      gradient.addColorStop(1, '#9b59b6');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      
      // Draw cross/pilgrimage symbol
      ctx.save();
      
      // Main cross in white/gold
      ctx.strokeStyle = '#f4e4c1';
      ctx.lineWidth = size * 0.08;
      ctx.lineCap = 'round';
      
      // Vertical line
      ctx.beginPath();
      ctx.moveTo(size / 2, size * 0.25);
      ctx.lineTo(size / 2, size * 0.75);
      ctx.stroke();
      
      // Horizontal line
      ctx.beginPath();
      ctx.moveTo(size * 0.35, size * 0.40);
      ctx.lineTo(size * 0.65, size * 0.40);
      ctx.stroke();
      
      // Add a subtle halo/circle
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size * 0.35, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = size * 0.03;
      ctx.stroke();
      
      ctx.restore();
    }

    // Draw both icons
    drawIcon('canvas192', 192);
    drawIcon('canvas512', 512);

    function downloadIcons() {
      // Download 192x192
      const canvas192 = document.getElementById('canvas192');
      const link192 = document.createElement('a');
      link192.download = 'icon-192x192.png';
      link192.href = canvas192.toDataURL();
      link192.click();
      
      // Download 512x512
      setTimeout(() => {
        const canvas512 = document.getElementById('canvas512');
        const link512 = document.createElement('a');
        link512.download = 'icon-512x512.png';
        link512.href = canvas512.toDataURL();
        link512.click();
      }, 500);
    }
  </script>
</body>
</html>
